; Google Drive sign-in for PVJ Pro (Authorization Code + PKCE, loopback redirect).
; Copy this file to secrets/drive_oauth.cfg (git-ignored) and fill in a Google
; Cloud OAuth client of type "Desktop app" with the Drive read-only scope.
; Only the Pro export preset packs secrets/drive_oauth.cfg into the build.
[oauth]
client_id="YOUR-CLIENT-ID.apps.googleusercontent.com"
client_secret="YOUR-CLIENT-SECRET"
